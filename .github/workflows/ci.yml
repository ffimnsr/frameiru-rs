name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        # fontconfig is discovered via pkg-config by slint's fontique (build
        # scripts always run, so even lint/docs jobs need the dev package).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build project
        run: cargo build --workspace --all-features --locked

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Hermetic default matrix: no cameras, no kernel module, no ONNX
          # Runtime download (see README "Testing").
          - name: default
            args: --workspace --locked
          # Everything on: ONNX inference tests, GPU compositor, V4L2, D-Bus.
          - name: all-features
            args: --workspace --all-features --locked

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run tests
        run: cargo test --quiet ${{ matrix.args }}

  test-arm64:
    # Covers the aarch64 release artifact natively (GitHub-hosted arm64 runner).
    name: Test (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run tests
        run: cargo test --quiet --workspace --locked

  installer:
    name: Installer check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: sh -n install.sh

      - name: Lint installer
        run: shellcheck --shell=dash --external-sources install.sh