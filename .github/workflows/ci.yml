name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        # fontconfig is discovered via pkg-config by slint's fontique (build
        # scripts always run, so even lint/docs jobs need the dev package).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build project
        run: cargo build --workspace --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      # Hermetic default matrix: no cameras, no kernel module, no ONNX
      # Runtime download (see README "Testing"). The `--all-features` matrix
      # is intentionally not CI: enabling `onnx-dynamic` makes ort abort
      # unless a system libonnxruntime is dlopen-able.
      - name: Run tests
        run: cargo test --quiet --workspace --locked

  test-arm64:
    # Covers the aarch64 release artifact natively (GitHub-hosted arm64 runner).
    name: Test (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: frameiru-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run tests
        run: cargo test --quiet --workspace --locked

  installer:
    name: Installer and hooks check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check installer
        run: sh -n install.sh

      - name: Lint installer
        run: shellcheck --shell=dash --external-sources install.sh

      - name: Syntax check git hooks
        run: |
          sh -n .githooks/pre-commit
          sh -n .githooks/lib/githooks.sh
          sh -n .githooks/record-tests-pass

      - name: Lint git hooks
        run: shellcheck --shell=dash --external-sources .githooks/pre-commit .githooks/lib/githooks.sh .githooks/record-tests-pass

      - name: Test git hook state logic
        shell: bash
        run: |
          set -euo pipefail

          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT

          git -C "$scratch" init -q
          git -C "$scratch" config user.email "ci@example.com"
          git -C "$scratch" config user.name "CI"
          mkdir -p "$scratch/crates/demo/src"
          printf 'fn main() {}\n' > "$scratch/crates/demo/src/main.rs"
          cp -r .githooks "$scratch/"
          git -C "$scratch" add crates/demo/src/main.rs

          key() {
            (cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
              sh -c '. .githooks/lib/githooks.sh; githooks_compute_key')
          }

          key1="$(key)"
          key2="$(key)"
          [ "$key1" = "$key2" ]  # deterministic

          # A staged change to a scoped file changes the key...
          printf 'fn main() { println!("x"); }\n' > "$scratch/crates/demo/src/main.rs"
          git -C "$scratch" add -A
          key3="$(key)"
          [ "$key1" != "$key3" ]

          # ...and committing does not flip it back (content, not git state).
          git -C "$scratch" commit -qm test
          key4="$(key)"
          [ "$key3" = "$key4" ]

          # Out-of-scope files (README) do not change the key.
          printf 'docs\n' > "$scratch/README.md"
          key5="$(key)"
          [ "$key4" = "$key5" ]

          # record-tests-pass writes state that githooks_state_matches accepts.
          (cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
            sh .githooks/record-tests-pass)
          cmd="$(cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
            sh -c '. .githooks/lib/githooks.sh; githooks_test_cmd')"
          stored_key="$(key)"
          (cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
            sh -c '. .githooks/lib/githooks.sh; githooks_state_matches "$1" "$2"' sh "$cmd" "$stored_key")

          # A mismatched key or command is rejected (state is stale).
          if (cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
              sh -c '. .githooks/lib/githooks.sh; githooks_state_matches "$1" "$2"' sh "$cmd" bogus-key); then
            echo "state_matches wrongly accepted a stale key" >&2
            exit 1
          fi
          if (cd "$scratch" && FRAMEIRU_PRE_COMMIT_STATE_FILE="$scratch/target/.githooks-state" \
              sh -c '. .githooks/lib/githooks.sh; githooks_state_matches "$1" "$2"' sh "cargo test --other" "$stored_key"); then
            echo "state_matches wrongly accepted a stale command" >&2
            exit 1
          fi

          # Drift check: installed copies must match .githooks/ sources, and
          # going stale must be reported without failing the command.
          drift() {
            (cd "$scratch" && sh -c '. .githooks/lib/githooks.sh; githooks_check_drift')
          }

          install_copies() {
            cp -r .githooks/. "$scratch/.git/hooks/"
            chmod +x "$scratch/.git/hooks/pre-commit" "$scratch/.git/hooks/record-tests-pass"
          }

          mkdir -p "$scratch/.git/hooks"
          install_copies
          [ -z "$(drift)" ]

          # An edited installed hook is drift...
          printf '\n# local edit\n' >> "$scratch/.git/hooks/pre-commit"
          case "$(drift)" in
            *"drift: .git/hooks/pre-commit differs from .githooks/pre-commit"*) ;;
            *) echo "edited installed hook was not reported as drift" >&2; exit 1 ;;
          esac

          # ...and so is a missing or non-executable copy.
          rm -f "$scratch/.git/hooks/lib/githooks.sh"
          case "$(drift)" in
            *"drift: .githooks/lib/githooks.sh is not installed"*) ;;
            *) echo "missing installed lib was not reported as drift" >&2; exit 1 ;;
          esac
          chmod -x "$scratch/.git/hooks/record-tests-pass"
          case "$(drift)" in
            *"drift: .git/hooks/record-tests-pass is not executable"*) ;;
            *) echo "non-executable installed hook was not reported as drift" >&2; exit 1 ;;
          esac

          # A leftover file this repo no longer ships is reported too, but
          # unrelated user hooks are not our business.
          printf '#!/bin/sh\n' > "$scratch/.git/hooks/lib/removed-helper.sh"
          printf '#!/bin/sh\n' > "$scratch/.git/hooks/commit-msg"
          case "$(drift)" in
            *"drift: .git/hooks/lib/removed-helper.sh is installed"*) ;;
            *) echo "leftover installed file was not reported as drift" >&2; exit 1 ;;
          esac
          case "$(drift)" in
            *commit-msg*) echo "unrelated user hook was reported as drift" >&2; exit 1 ;;
            *) ;;
          esac

          # Re-installing clears every warning.
          rm -f "$scratch/.git/hooks/lib/removed-helper.sh"
          install_copies
          [ -z "$(drift)" ]

          # core.hooksPath = .githooks runs the sources in place: nothing can
          # drift, so nothing is reported.
          git -C "$scratch" config core.hooksPath .githooks
          [ -z "$(drift)" ]
          git -C "$scratch" config --unset core.hooksPath
          [ -z "$(drift)" ]

          echo "git hook state logic: ok"
