# yaml-language-server: $schema=https://raw.githubusercontent.com/ffimnsr/mk-rs/main/docs/schema.json

use_cargo: true

tasks:
  greet:
    commands:
      - echo "Hello, World!"
    description: Sample greet command

  install-local:
    description: Build every release binary (CLI with full features, GUI, webcam utils, loopback helper) and install them to ~/.local/bin
    commands:
      - cargo build --release -p frameiru-cli --features full
      - cargo build --release -p frameiru-ui
      - cargo build --release -p frameiru-webcam-utils
      - cargo build --release -p frameiru-loopback-helper
      - install -Dm755 target/release/frameiru-cli "$HOME/.local/bin/frameiru-cli"
      - install -Dm755 target/release/frameiru-ui "$HOME/.local/bin/frameiru-ui"
      - install -Dm755 target/release/frameiru-webcam-utils "$HOME/.local/bin/frameiru-webcam-utils"
      # The GUI looks for the helper next to itself (or under /usr/libexec), so
      # ~/.local/bin keeps the banner's LOAD button working without a root
      # install; /usr/libexec + the polkit policy stay the system path.
      - install -Dm755 target/release/frameiru-loopback-helper "$HOME/.local/bin/frameiru-loopback-helper"

  flatpak-build:
    description: Build and install the Flatpak (com.vastorigins.frameiru) for the current user
    commands:
      - flatpak-builder --user --install --force-clean --state-dir=.flatpak-builder build-dir packaging/flatpak/com.vastorigins.frameiru.yml

  flatpak-run:
    description: Run the installed Frameiru Flatpak
    commands:
      - flatpak run com.vastorigins.frameiru
