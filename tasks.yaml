# yaml-language-server: $schema=https://raw.githubusercontent.com/ffimnsr/mk-rs/main/docs/schema.json

use_cargo: true

tasks:
  greet:
    commands:
      - echo "Hello, World!"
    description: Sample greet command

  ci:
    description: Run the same quality gates as the CI workflow (fmt, clippy, workspace tests) and record the test pass for the pre-commit hook
    commands:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - cargo test --quiet --workspace --locked
      - sh .githooks/record-tests-pass

  install-githooks:
    description: Install the pre-commit hook from .githooks into .git/hooks (overwrites a previously installed copy, leaves other hooks alone)
    commands:
      - mkdir -p .git/hooks && cp -r .githooks/. .git/hooks/ && chmod +x .git/hooks/pre-commit .git/hooks/record-tests-pass
      - echo "Installed pre-commit hook to .git/hooks/pre-commit"

  uninstall-githooks:
    description: Remove the pre-commit hook and its test state (target/.githooks-state)
    commands:
      - rm -f .git/hooks/pre-commit .git/hooks/record-tests-pass
      - rm -rf .git/hooks/lib
      - rm -f target/.githooks-state
      - echo "Removed pre-commit hook and test state"

  release-package:
    description: Build the four release binaries (full features) and pack dist/*.tar.gz like the release workflow
    commands:
      - cargo build --locked --release -p frameiru-cli --features full
      - cargo build --locked --release -p frameiru-ui
      - cargo build --locked --release -p frameiru-webcam-utils
      - cargo build --locked --release -p frameiru-loopback-helper
      - rm -rf dist
      - "VERSION=\"$(grep -m1 '^version = ' Cargo.toml | cut -d '\"' -f2)\"; ARCH=\"$(uname -m)\"; BASENAME=\"frameiru-${VERSION}-${ARCH}-unknown-linux-gnu\"; mkdir -p \"dist/${BASENAME}/packaging/polkit\"; cp target/release/frameiru-cli target/release/frameiru-ui target/release/frameiru-webcam-utils target/release/frameiru-loopback-helper \"dist/${BASENAME}/\"; cp packaging/polkit/org.frameiru.loopback.policy \"dist/${BASENAME}/packaging/polkit/\"; cp README.md LICENSE \"dist/${BASENAME}/\"; tar -czf \"dist/${BASENAME}.tar.gz\" -C dist \"${BASENAME}\"; sha256sum \"dist/${BASENAME}.tar.gz\" > \"dist/${BASENAME}.tar.gz.sha256\"; echo \"Packed dist/${BASENAME}.tar.gz\""

  install-local:
    description: Build every release binary (CLI with full features, GUI, webcam utils, loopback helper) and install them to ~/.local/bin
    commands:
      - cargo build --release -p frameiru-cli --features full
      - cargo build --release -p frameiru-ui
      - cargo build --release -p frameiru-webcam-utils
      - cargo build --release -p frameiru-loopback-helper
      - install -Dm755 target/release/frameiru-cli "$HOME/.local/bin/frameiru-cli"
      - install -Dm755 target/release/frameiru-ui "$HOME/.local/bin/frameiru-ui"
      - install -Dm755 target/release/frameiru-webcam-utils "$HOME/.local/bin/frameiru-webcam-utils"
      # The GUI looks for the helper next to itself (or under /usr/libexec), so
      # ~/.local/bin keeps the banner's LOAD button working without a root
      # install; /usr/libexec + the polkit policy stay the system path.
      - install -Dm755 target/release/frameiru-loopback-helper "$HOME/.local/bin/frameiru-loopback-helper"

  flatpak-build:
    description: Build and install the Flatpak (com.vastorigins.frameiru) for the current user
    commands:
      - flatpak-builder --user --install --force-clean --state-dir=.flatpak-builder build-dir packaging/flatpak/com.vastorigins.frameiru.yml

  flatpak-run:
    description: Run the installed Frameiru Flatpak
    commands:
      - flatpak run com.vastorigins.frameiru
