[package]
name = "frameiru-segment"
description = "ONNX background segmentation: letterboxing, model runner, temporal mask smoothing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# ONNX inference via the `ort` crate. Kept off by default: enabling it
# downloads onnxruntime binaries at build time. Preprocessing,
# postprocessing, and the temporal smoother are always available and fully
# tested without it.
onnx = ["dep:ort"]

[dependencies]
frameiru-core = { workspace = true }
ort = { version = "2.0.0-rc.13", optional = true, features = ["download-binaries"] }
tracing.workspace = true
# SIMD-accelerated bilinear resize for letterbox preprocessing.
fast_image_resize = "6"

[dev-dependencies]
# ort's process-global cpuinfo/env init races under the parallel test
# harness; real-model integration tests run serially.
serial_test = "3"
