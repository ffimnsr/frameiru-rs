[package]
name = "frameiru-ui"
description = "Slint desktop GUI for frameiru"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["gpu", "v4l2", "onnx"]
# GPU compositor via wgpu (falls back to CPU automatically).
gpu = ["frameiru-compose/gpu"]
# Real camera + loopback support; without it the GUI runs on the mock
# source with a null sink (headless preview mode).
v4l2 = ["frameiru-capture/v4l2", "frameiru-sink/v4l2"]
# ONNX background segmentation (model path passed on the command line).
onnx = ["frameiru-segment/onnx"]
# Same, but with onnxruntime loaded at runtime from a bundled library
# (`ORT_DYLIB_PATH`) instead of downloaded at build time. Used by the Flatpak
# build, whose sandbox has no network; implies `onnx`.
onnx-dynamic = ["onnx", "frameiru-segment/onnx-dynamic"]

[dependencies]
frameiru-core = { workspace = true, features = ["slint"] }
frameiru-capture = { workspace = true }
frameiru-compose = { workspace = true }
frameiru-pipeline = { workspace = true }
frameiru-segment = { workspace = true }
frameiru-sink = { workspace = true }
frameiru-webcam-utils = { workspace = true }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
slint = { version = "1", features = ["backend-winit", "renderer-femtovg", "raw-window-handle-06"] }
# Native window handle (xcb/xlib id) for EWMH minimize polling.
raw-window-handle = "0.6"
rfd = "0.15"
tokio.workspace = true
# KDE Plasma minimize detection (KWin scripting over the session bus).
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# PiP work-area geometry (EWMH _NET_WORKAREA); already in the tree via winit.
x11rb = "0.13"

[build-dependencies]
slint-build = "1"
